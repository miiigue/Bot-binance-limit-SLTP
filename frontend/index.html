<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 1. Redireccion forzosa a HTTPS institucional para habilitar instalacion nativa
      if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        location.replace('https://178.105.192.140.sslip.io' + location.pathname + location.search + location.hash);
      }

      // 2. Captura INMEDIATA del evento nativo de instalacion antes de que cargue React
      window.__wtn_install_prompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__wtn_install_prompt = e;
        console.log('[WTN] Prompt nativo de instalacion capturado globalmente.');
        window.dispatchEvent(new CustomEvent('wtn-install-ready'));
      });

      // 3. Registrar Service Worker de inmediato
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function (reg) {
            console.log('[WTN] Service Worker activo:', reg.scope);
          })
          .catch(function (err) {
            console.warn('[WTN] Service Worker error:', err);
          });
      }
    </script>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  </head>
